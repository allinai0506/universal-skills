name: Ontology Gate
on: [pull_request]
jobs:
  ontology-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/ontology_impact.py "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" ontology
      - run: python scripts/ontology_validate.py ontology
