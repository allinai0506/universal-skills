display_name: PSEO 程序化SEO
short_description: 批量生成结构化SEO页面——关键词矩阵、内容模板、CMS导入一体化管道
default_prompt: >
  围绕主词簇批量生成信息增量高的结构化SEO页面。
  请提供 seed keyword 和目标领域（如 ERP/MES/WMS 实施服务），我会按
  Config→Keywords→Schema→Render→Review→Validate→Scale→Import 管道逐步推进。
  适用 B2B SaaS 服务类内容，先小样本验证（10 页 avg≥8）再规模化，
  Money Pages 必须人审，禁止编造客户/数字/竞品参数。